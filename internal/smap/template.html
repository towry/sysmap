<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script>
// Set the theme before first paint: the saved choice, else the system setting.
(function () {
  var t = null;
  try { t = localStorage.getItem("sysmap-theme"); } catch (e) {}
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/* Palette from obsidian.md/help/install: white and near-black pages, purple accent, hairline
   #e4e4e4 / #333 borders. The light accent is a little deeper than theirs (#8a5cf5 is 4.3:1 on
   white, this is 4.9:1), and the kind and state colours are this tool's own. */
:root{
  --bg:#ffffff;--card:#fafafa;--bg2:#f3f3f3;--ui:#e4e4e4;--ui2:#d6d6d6;--ui3:#bdbdbd;
  --tx:#222222;--tx2:#5c5c5c;--tx3:#a3a3a3;
  --core:#1a7f77;--core-tx:#16706a;--biz:#c2570c;--biz-tx:#a64a0a;--ext:#5c5c5c;
  --new:#26803a;--chg:#c9420c;--accent:#7d4ff0;--focus:#1b6ef3;--node:#ffffff;--edge:#8b8b8b;
  --sans:ui-sans-serif,-apple-system,"SF Pro Text","PingFang SC","Noto Sans CJK SC",InterVariable,Inter,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme=dark]{
  --bg:#101010;--card:#151515;--bg2:#1c1c1c;--ui:#333333;--ui2:#444444;--ui3:#5a5a5a;
  --tx:#dadada;--tx2:#b3b3b3;--tx3:#777777;
  --core:#3fb3a8;--core-tx:#4cc2b7;--biz:#e8903f;--biz-tx:#eb9f58;--ext:#b3b3b3;
  --new:#5fb878;--chg:#ef6c4d;--accent:#a68af9;--focus:#5b9bff;--node:#1c1c1c;--edge:#6b6b6b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.55 var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  caret-color:var(--accent);color-scheme:light}
:root[data-theme=dark] body{color-scheme:dark}
*{scrollbar-width:thin;scrollbar-color:var(--ui3) transparent}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
.ic{width:14px;height:14px;flex:none}
.mono{font-family:var(--mono)}

#app{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;height:100vh}
#app.diagram-expanded{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh}
#app.diagram-expanded #side,#app.diagram-expanded #detail{display:none}
#app.diagram-expanded #page{min-height:0}

/* sidebar */
#side{overflow:auto;border-right:1px solid var(--ui);padding:14px 8px 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.switch{position:relative;flex:none;width:46px;height:24px;border:1px solid var(--ui2);border-radius:12px;background:transparent;cursor:pointer;color:var(--tx2);transition:border-color .12s}
.switch:hover{border-color:var(--ui3)}
.switch .ic{position:absolute;top:4px;width:14px;height:14px}
.switch .knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--tx);transition:transform .15s}
:root[data-theme=dark] .switch .knob{transform:translateX(22px)}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
#searchToggle{flex:none}
#searchToggle[aria-expanded=true]{background:var(--bg2);border-color:var(--ui3);color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--ui2);border-radius:5px;padding:0 0 0 8px;min-height:40px;color:var(--tx2);font-size:13px;background:var(--bg);transition:border-color .12s}
.search:hover{border-color:var(--ui3)}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--tx)}
.search input::placeholder{color:var(--tx2)}
.search-clear{flex:none;width:40px;height:38px;border:0;background:transparent;color:var(--tx2);cursor:pointer;padding:0;font-size:18px;line-height:1}
.search-clear:hover{color:var(--tx)}
.search-status{font-size:12px;color:var(--tx2);padding:0 2px}
#warn{display:flex;align-items:center;gap:8px;border:1px solid var(--ui2);background:transparent;border-radius:5px;min-height:28px;padding:0 8px;color:var(--chg);cursor:pointer;text-align:left;font-size:12.5px}
[hidden]{display:none!important} /* the author rules for .btn etc. would otherwise show hidden elements */
.group{font-size:12px;font-weight:650;color:var(--tx2);margin:10px 0 0}
.orow{display:flex;align-items:center;gap:5px;min-height:27px;font-size:13px;padding-right:6px;cursor:pointer;white-space:nowrap;border-radius:6px;position:relative;transition:background-color .12s,color .12s}
.orow:hover{background:color-mix(in srgb,var(--tx) 6%,transparent)}
.orow:focus-visible,.frow:focus-visible{outline-offset:-2px}
[data-go],[data-scope],[data-flow],[data-enter]{cursor:pointer}
.orow.sel{color:var(--accent);font-weight:600}
.orow.sel::before{content:"";position:absolute;left:-1px;top:2px;bottom:2px;width:2px;background:var(--accent);border-radius:1px}
.orow .caret{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);flex:none}
.orow .caret .ic{transition:transform .12s}
.orow .caret.open .ic{transform:rotate(90deg)}
.orow .t{overflow:hidden;text-overflow:ellipsis;flex:1}
.orow .n{color:var(--tx2);font-size:12px;font-weight:400}
.kids-rule{margin-left:6px;padding-left:7px;border-left:1px solid var(--ui2)}
.dot{width:7px;height:7px;border-radius:2px;flex:none;background:var(--ext)}
.dot.core{background:var(--core)}.dot.biz{background:var(--biz)}
#impactList:not(:empty){padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--ui3)}
.irow.sub{padding-left:14px}
.irow .hint{color:var(--tx2);font-size:12px;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:90px}
.why li{margin-bottom:6px}
.ptree{margin:6px 0 2px;font-size:13px}
.ptree .lv{margin-left:6px;padding-left:10px;border-left:1px solid var(--ui3)}
.ptree .row{padding:2px 0}
.ptree .root{font-weight:600}
.why .chain{color:var(--tx2);font-size:12.5px}
.why .chain b{color:var(--tx);font-weight:600}
.frow{display:flex;gap:6px;align-items:center;min-height:27px;font-size:13px;padding:0 6px;border-radius:6px;cursor:pointer;color:var(--tx);transition:background-color .12s}
.frow:hover{background:color-mix(in srgb,var(--tx) 6%,transparent)}
.frow.sel{color:var(--accent);font-weight:600}
.frow .n{margin-left:auto;color:var(--tx2);font-size:12px;font-weight:400}

/* page */
#page{display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px 12px 12px}
#banner{display:none;border:1px solid var(--ui2);border-radius:8px;padding:6px 10px;margin-bottom:8px;font-size:13px;background:var(--bg2)}
#banner.on{display:block}
#banner.err{border-color:var(--chg)}
#top{margin-bottom:8px}
#crumbs{display:flex;gap:2px;align-items:center;font-size:12.5px;color:var(--tx2);height:22px;overflow:hidden;white-space:nowrap} /* always present: its height must not depend on the level */
#crumbs a{padding:1px 4px;border-radius:4px;color:var(--tx2)}
#crumbs a:hover{color:var(--tx);text-decoration:none;background:var(--bg2)}
#crumbs .sep{display:inline-flex;color:var(--tx3)}
#crumbs b{font-weight:500;color:var(--tx);padding:1px 4px}
.titlerow{display:flex;align-items:center;gap:12px;min-width:0}
.navbtns{display:flex;gap:4px;flex:none}
.navbtns .btn{min-height:28px;width:28px}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{background:var(--bg);border-color:var(--ui2)}
h1{font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.01em;margin:0;flex:none;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lead{color:var(--tx2);font-size:14px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stats{color:var(--tx2);font-size:12.5px;flex:none;margin-left:auto}
#card{flex:1;min-height:300px;display:flex;flex-direction:column;position:relative;border:1px solid var(--ui);background:var(--card);border-radius:8px;overflow:hidden}
#diagramBar{display:flex;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--ui);font-size:12.5px;color:var(--tx2);background:var(--card)}
#diagramBar code{font:12px var(--mono);color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
#diagramBar .btn{min-height:26px;padding:0 8px;margin-left:auto}
#diagramBar #toggleSidebars{margin-left:0}
#card.diagram .cardfoot .lg{display:none}
/* Pele reads these variables; mapping them to the page palette is what makes a diagram follow the theme. */
.pele-theme{--pele-bg:var(--card);--pele-fg:var(--tx);--pele-muted:var(--tx2);--pele-line:var(--edge);--pele-surface:var(--bg2);--pele-surface-alt:var(--ui);--pele-border:var(--ui3);--pele-accent:var(--accent);--pele-critical:var(--chg);--pele-font:var(--sans);--pele-font-mono:var(--mono);--pele-radius:4px}
#diagramPane{position:absolute;left:0;top:0;box-sizing:border-box;background:var(--card);display:flex;align-items:center;justify-content:center}
#diagramPane svg{display:block}
#canvas.diagram #areas,#canvas.diagram #edges,#canvas.diagram #pills,#canvas.diagram #nodes{display:none}
#tools{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--tx2)}
#tools .btn{min-height:28px;padding:0 8px;border-color:transparent;background:transparent}
#tools .btn.icon{width:28px;padding:0}
#tools .btn:hover{background:var(--bg2);border-color:var(--ui2)}
#tools .btn[aria-pressed=true]{background:var(--bg2);border-color:var(--ui3);color:var(--tx)}
#hops{display:inline-flex;gap:2px;margin-right:4px}
#tools output{min-width:40px;text-align:center;font-size:12.5px}
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;border:1px solid var(--ui2);background:var(--bg);border-radius:5px;padding:0 10px;min-height:32px;cursor:pointer;color:var(--tx);transition:background-color .12s,border-color .12s}
.btn:hover{background:var(--bg2);border-color:var(--ui3)}
.btn:active{transform:scale(.96)}
.btn{position:relative}
.btn::after{content:"";position:absolute;inset:-4px}
.btn.icon{padding:0;width:32px}
.btn.ghost{border-color:transparent;background:transparent}
#viewport{flex:1;position:relative;overflow:hidden;touch-action:none}
#canvas{position:absolute;left:0;top:0}
#areas{position:absolute;left:0;top:0}
.area{position:absolute;box-sizing:border-box;border:1px solid var(--ui3);border-radius:12px;background:color-mix(in srgb,var(--tx) 3%,transparent);pointer-events:none}
.area span{position:absolute;left:12px;top:4px;font-size:12px;font-weight:650;color:var(--tx2);max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.cardfoot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:5px 12px;font-size:12px;color:var(--tx2);border-top:1px solid var(--ui)}
.cardfoot .lg{display:inline-flex;gap:6px;align-items:center}
.cardfoot i.cnt{width:auto;height:auto;min-width:15px;border-radius:8px;border:1px solid var(--ui3);background:var(--bg2);font-style:normal;font-size:11px;line-height:13px;text-align:center;color:var(--tx)}
.cardfoot i{width:11px;height:11px;border-radius:3px;border:1.5px solid;display:inline-block}
.cardfoot #tools{margin-left:auto}

/* graph */
#edges,#pills{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.edge{fill:none;stroke:var(--edge)}
.edge.hot{stroke:var(--tx)}
#ar path{fill:var(--edge)}#arh path{fill:var(--tx)}
.pill{fill:var(--bg);stroke:var(--ui3);pointer-events:auto}
.pill.step{fill:var(--tx);stroke:var(--tx)}
.pilltx{font-size:12px;fill:var(--tx);text-anchor:middle;pointer-events:auto}
.pilltx.step{fill:var(--bg)}
.node{--k:var(--ext);position:absolute;display:flex;flex-direction:column;border:1px solid color-mix(in srgb,var(--k) 60%,var(--card));border-radius:8px;
  background:color-mix(in srgb,var(--k) 9%,var(--node));padding:8px 12px 7px;cursor:pointer;overflow:hidden;
  transition:opacity .15s,background-color .12s,border-color .12s}
.node.core{--k:var(--core)}.node.biz{--k:var(--biz)}
.node.ext{border-style:dashed}
.node:hover{background:color-mix(in srgb,var(--k) 15%,var(--node))}
.node.ghost{opacity:.8;border-style:dashed}
.node.dim,.node.ghost.dim{opacity:.45}
.node.m-new{outline:2px solid var(--new);outline-offset:2px}
.node.m-chg{outline:2px solid var(--chg);outline-offset:2px}
/* --inv is 1/zoom (set from the panzoom event), so the ring keeps its on-screen weight when the map is zoomed out */
.node.sel{outline:calc(2px * var(--inv,1)) solid var(--accent);outline-offset:calc(2px * var(--inv,1));box-shadow:0 0 0 calc(7px * var(--inv,1)) color-mix(in srgb,var(--accent) 22%,transparent),0 calc(8px * var(--inv,1)) calc(22px * var(--inv,1)) color-mix(in srgb,var(--accent) 30%,transparent)}
.node.sel .title{color:var(--accent)}
.node.centre:not(.sel){outline:calc(2px * var(--inv,1)) dashed var(--accent);outline-offset:calc(2px * var(--inv,1))}
.node:focus-visible{outline-color:var(--focus);outline-offset:4px}
.node .head{flex:none;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.node .title{font-weight:650;font-size:14px;line-height:1.25;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;word-break:break-word}
.node .desc{flex:0 1 auto;min-height:0;font-size:12px;line-height:1.32;color:var(--tx2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty;word-break:break-word}
.node .foot{flex:none;margin-top:auto;padding-top:5px;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden;font-size:12px;line-height:1.2;color:var(--tx2)}
.node .kind{font-weight:650}
.node.core .kind{color:var(--core-tx)}.node.biz .kind{color:var(--biz-tx)}
.node .kids{margin-left:auto;display:inline-flex;gap:4px;align-items:center}
.tag{font-size:12px;font-weight:600;line-height:18px;padding:0 6px;border-radius:4px;white-space:nowrap;flex:none}
.tag.new{background:var(--new);color:var(--bg)}
.tag.chg{background:var(--chg);color:var(--bg)}
.tag.centre{background:var(--accent);color:var(--bg)}
.tag.hit{border:1px solid var(--chg);color:var(--chg);line-height:16px}

/* detail rail */
#detail{overflow:auto;padding:30px 24px 28px 8px;overflow-wrap:anywhere;word-break:break-word}
#detail h2{font-size:20px;font-weight:700;line-height:1.3;margin:6px 0 2px;text-wrap:balance}
#detail h3{font-size:13px;font-weight:650;margin:24px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--ui)}
#detail h3 span{color:var(--tx2);font-weight:400}
#detail .id{font:12px var(--mono);color:var(--tx2)}
#detail p{margin:8px 0;text-wrap:pretty}
#detail .kindline{font-size:13px;font-weight:650}
#detail .kindline.core{color:var(--core-tx)}#detail .kindline.biz{color:var(--biz-tx)}#detail .kindline.ext{color:var(--ext)}
#detail .detail{white-space:pre-wrap;background:var(--bg2);border-radius:8px;padding:9px 12px;font-size:13.5px}
#detail ul{list-style:none;margin:0;padding:0}
#detail li{padding:4px 0}
.lab{color:var(--tx2);font-size:12.5px}
#detail code{font:12.5px var(--mono);background:var(--bg2);padding:2px 6px;border-radius:4px}
.diagram-card{border:1px solid var(--ui);border-radius:8px;background:var(--bg);padding:8px;margin:8px 0}
.diagram-head{margin:0 0 6px}
#detail .diagram-head code{display:block;font:11.5px var(--mono);color:var(--tx2);background:none;padding:0;border-radius:0;line-height:1.4;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.diagram-preview{background:var(--card);border-radius:5px;overflow:hidden;padding:6px;display:flex;align-items:center;justify-content:center;min-height:64px}
.diagram-preview svg{display:block;width:100%;height:auto;max-height:150px}
.diagram-foot{display:flex;justify-content:flex-end;margin-top:8px}
.diagram-foot .btn{min-height:26px;padding:0 8px;font-size:12.5px;flex:none}
.verdict{border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13.5px;background:var(--bg2)}
.verdict b{display:block;font-size:13px;margin-bottom:2px}
.verdict.extension{background:color-mix(in srgb,var(--new) 16%,var(--bg))}
.verdict.contained{background:color-mix(in srgb,var(--biz) 16%,var(--bg))}
.verdict.wide{background:color-mix(in srgb,var(--chg) 16%,var(--bg))}
.step{display:flex;gap:10px;padding:6px 0;cursor:pointer}
.step b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--tx);color:var(--bg);text-align:center;font-size:12px;line-height:22px}
.empty{color:var(--tx2);padding:30px;text-align:center}

#menu{display:none;margin-left:auto;margin-right:8px}
@media (max-width:1100px){
  #menu{display:inline-flex}
  body:not(.menu-open) #outline,body:not(.menu-open) #flows,body:not(.menu-open) #impactList{display:none}
  #side{max-height:none}
  #app{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto}
  #side{padding:12px 14px 8px}
  #page{padding:10px 12px;min-height:640px}
  #detail{padding:8px 20px 28px}
}
@media (max-width:700px){
  .cardfoot{gap:6px 10px}
  .node .title{font-size:13.5px}
  .node .foot .dep{display:none}
  .cardfoot #tools{margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  h1{font-size:19px;max-width:100%}
  .titlerow{flex-wrap:wrap;gap:2px 10px}
  #stats{margin-left:0}
}
.btn,#tools output,.cardfoot .lg{white-space:nowrap}
/* Changing level plays in two beats: the old cards fade out, then the new ones come in one after
   another, left to right, the edges last. Going in starts a little smaller, going out a little larger. */
.node.leaving{opacity:0!important;transform:scale(.97);transition:opacity .12s ease-in,transform .12s ease-in}
#edges.leaving,#pills.leaving,#areas.leaving{opacity:0;transition:opacity .1s ease-in}
.node.enter{animation:nodeIn .26s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 42ms)}
#edges.enter,#pills.enter{animation:fadeIn .3s ease-out both;animation-delay:var(--edge-delay)}
#areas.enter{animation:fadeIn .25s ease-out both}
@keyframes nodeIn{from{opacity:0;transform:translateY(6px) scale(var(--from,1))}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

// A smooth path through dagre's route points, and where to put the label.

  let pills = ""; // rendered in #pills above #nodes so node cards never obscure labels
  const taken = v.ids.map((id) => ({x: pos.get(id).x, y: pos.get(id).y, w: W, h: H, g: 8}));
  for (const e of v.edges) {
    const pts = points.get(e.a + "\u0000" + e.b);
    const r = route(pts);
    const steps = flowHot.get(e.a + "\u0000" + e.b);
    const hot = steps || special() || (sel && (e.a === sel || e.b === sel));
    const faded = (state.flow && !steps) || (!state.flow && sel && !hot);
    const w = (1.5 + Math.log2(e.count) * 0.8) * (hot ? 1.4 : 1);
    paths += `<path class="edge${hot ? " hot" : ""}" d="${r.d}" stroke-width="${w}" ${e.async ? 'stroke-dasharray="7 5"' : ""} opacity="${faded ? 0.22 : 1}" marker-end="url(#${hot ? "arh" : "ar"})"/>`;
    let text = "";

    else if (e.count > 1 && !sel && !state.flow) text = String(e.count);
    if (text) {
      const shown = fitLabel(text), cls = steps ? " step" : "", pw = textW(shown) + 14;
      let at = r.mid, fewest = Infinity;
      // Along the line first; when the line is shorter than the labels, step just above or below it.
      for (const [t, dy] of [

        [0.5, 24], [0.5, -24], [0.4, 24], [0.4, -24], [0.6, 24], [0.6, -24],
        [0.5, 48], [0.5, -48]

        const m = pointAt(pts, t), c = {x: m.x, y: m.y + dy}, box = {x: c.x - pw / 2, y: c.y - 10, w: pw, h: 20};
        const n = taken.reduce((s, b) => s + overlap(box, b), 0);
        if (n < fewest) { fewest = n; at = c; }
        if (!n) break;
      }
      taken.push({x: at.x - pw / 2, y: at.y - 10, w: pw, h: 20, g: 10});
      pills += `<g><title>${esc(text)}</title><rect class="pill${cls}" x="${at.x - pw / 2}" y="${at.y - 10}" width="${pw}" height="20" rx="10"/><text class="pilltx${cls}" x="${at.x}" y="${at.y + 4}">${esc(shown)}</text></g>`;
    }
  }

  pillsSvg.innerHTML = pills;

  let html = "";
  const rank = new Map([...v.ids].sort((a, b) => pos.get(a).x + pos.get(a).y - (pos.get(b).x + pos.get(b).y)).map((id, i) => [id, i]));
  const anim = enterAnim; enterAnim = null;
  for (const id of v.ids) {
    const n = byId.get(id), p = pos.get(id);
    const cls = ["node", n.kind];
    if (anim) cls.push("enter");
    if (n.mark) cls.push(n.mark === "+" ? "m-new" : "m-chg");
    if (v.ghost.has(id)) cls.push("ghost");
    if (id === sel) cls.push("sel");
    if (state.hood === id) cls.push("centre");
    if ((state.flow && !hotNodes.has(id)) || (!state.flow && !special() && sel && id !== sel && !v.edges.some((e) => (e.a === sel && e.b === id) || (e.b === sel && e.a === id)))) cls.push("dim");
    const centre = state.hood === id ? '<span class="tag centre">中心</span>' : "";
    const tag = centre + (n.mark ? `<span class="tag ${n.mark === "+" ? "new" : "chg"}">${n.mark === "+" ? "新增" : "修改"}</span>` : (affected.has(id) ? `<span class="tag hit" title="${esc(causeText(id))}">${wired.has(id) ? "要一起改" : "需检查"}</span>` : ""));
    const dep = n.kind === "core" && n.fanin ? `<span class="dep">被 ${n.fanin} 个依赖</span>` : "";
    const codeTag = hasCodeId(id) ? "" : `<span>· ${esc(shortId(id))}</span>`;
    const outer = v.ghost.has(id) ? "<span>· 层外</span>" : special() && !boxes.length && par(id) ? `<span>· ${esc(byId.get(par(id)).title)}</span>` : "";
    const kids = n.children.length ? `<span class="kids" title="包含 ${n.children.length} 个子节点,点这里或双击进入" data-kids>${ic("in")} ${n.children.length}</span>` : "";
    html += `<div class="${cls.join(" ")}" tabindex="0" role="button" data-id="${esc(id)}" style="left:${p.x}px;top:${p.y}px;width:${W}px;height:${H}px${anim ? `;--i:${Math.min(rank.get(id), 10)};--from:${anim.from}` : ""}" title="${esc(n.title)} (${esc(n.id)})"><div class="head"><span class="title" title="${esc(n.title)}">${esc(n.title)}</span>${tag}</div><div class="desc" title="${esc(n.desc)}">${esc(n.desc)}</div><div class="foot"><span class="kind">${KIND[n.kind]}</span>${codeTag}${outer}${dep}__TASK_BADGE____DIAG_BADGE__${kids}</div></div>`;
  }

    void edgesEl.getBoundingClientRect();
    edgesEl.classList.add("enter");
    pillsEl.classList.add("enter");

  $("nodes").innerHTML = html || '<div class="empty">这一层还没有节点</div>';
}

function renderSide() {
  const q = query.trim().toLowerCase();
  const match = (n) => !q || (n.id + " " + n.title + " " + n.desc).toLowerCase().includes(q);
  const keep = new Map(), wired = new Set(D.impact.summary.wired);
  const visit = (id) => { const n = byId.get(id); let any = match(n); for (const c of n.children) any = visit(c) || any; keep.set(id, any); return any; };
  roots().forEach(visit);
  const count = q ? D.nodes.filter(match).length : 0;
  $("searchStatus").hidden = !q;
  $("searchStatus").textContent = q ? `找到 ${count} 个节点` : "";
  $("searchClear").hidden = !query;
  $("impactList").hidden = !!q;
  $("flows").hidden = !!q;
  const walk = (id) => {
    if (!keep.get(id)) return "";
    const n = byId.get(id);
    const isOpen = q ? true : open.has(id);
    const caret = n.children.length ? `<span class="caret ${isOpen ? "open" : ""}" data-caret="${esc(id)}">${ic("chev")}</span>` : '<span class="caret"></span>';
    const mk = n.mark ? `<span class="tag ${n.mark === "+" ? "new" : "chg"}">${n.mark === "+" ? "新" : "改"}</span>` : "";
    const hit = !n.mark && causes(id).length ? `<span class="tag hit" title="${esc(causeText(id))}">${wired.has(id) ? "要一起改" : "需检查"}</span>` : "";
    const fan = n.kind === "core" && n.fanin ? `<span class="n" title="${n.fanin} 个节点依赖它">${n.fanin}</span>` : "";
    let html = `<div class="orow ${state.sel === id ? "sel" : ""}" tabindex="0" data-id="${esc(id)}" title="${esc(n.title)}">${caret}<span class="dot ${n.kind}"></span><span class="t" title="${esc(n.title)}">${esc(n.title)}</span>${mk}__TASK_BADGE____DIAG_BADGE__${hit}${fan}</div>`;
    if (isOpen && n.children.length) html += `<div class="kids-rule">${n.children.map(walk).join("")}</div>`;
    return html;
  };
  $("outline").innerHTML = roots().map(walk).join("") || '<div class="empty">没有匹配的节点</div>';
  const items = D.impact.items.filter((it) => it.dependents.length), s = D.impact.summary;
  const grp = [s.wired.length ? `要一起改 ${s.wired.length} 个` : "", s.inspect.length ? `需检查 ${s.inspect.length} 个` : ""].filter(Boolean).join(" · ");
  const row = (id, extra, cls) => `<div class="orow irow ${cls} ${state.sel === id ? "sel" : ""}" tabindex="0" data-id="${esc(id)}" title="${esc(byId.get(id).title)}"><span class="dot ${byId.get(id).kind}"></span><span class="t" title="${esc(byId.get(id).title)}">${esc(byId.get(id).title)}</span>${extra}</div>`;
  $("impactList").innerHTML = items.length ? `<div class="group">${grp} <a tabindex="0" data-impact="*">在画布上看</a></div>` + items.map((it) => row(it.id, `<span class="tag ${it.mark === "+" ? "new" : "chg"}">${it.mark === "+" ? "新" : "改"}</span>`, "") + it.dependents.map((d) => { const via = it.paths[d]; const step = via.length > 2 ? ((inSub(via[2], via[1]) ? "上级 " : "经 ") + byId.get(via[1]).title) : (it.mark === "+" && wired.has(d) ? "要一起改" : "直接"); return row(d, `<span class="hint" title="${esc(causeText(d))}">${esc(step)}</span>`, "sub"); }).join("")).join("") : "";

// Who a node is affected by: each planned node that reaches it, with the chain of nodes between.
function causes(id) {
  return D.impact.items.filter((it) => it.paths && it.paths[id]).map((it) => ({it, path: it.paths[id]}));
}
const markWord = (it) => it.mark === "+" ? "新增" : "修改";
const titleLink = (id) => `<a tabindex="0" data-go="${esc(id)}" title="${esc(id)}">「${nameWithId(id)}」</a>`;
const edgeNote = (from, to) => {
  const labs = D.edges.filter((e) => inSub(e.from, from) && inSub(e.to, to) && e.label).map((e) => e.label);
  return labs.length ? `（连线说明：${esc(labs.join(" · "))}）` : "";
};
function causeText(id) {
  const me = byId.get(id).title;
  return causes(id).map(({it, path}) => {
    const t = byId.get(it.id).title, mids = path.slice(1, -1);
    if (path.length === 2) return it.mark === "+" ? `因为「${me}」直接调用了本次新增的「${t}」，也要一起改` : `因为「${me}」直接依赖了本次修改的「${t}」，需确认是否受影响`;
    if (mids.length === 1 && inSub(path[2], path[1])) return `因为「${me}」连到了整个「${byId.get(path[1]).title}」区域，而该区域内的「${t}」本次有修改，需确认是否受影响`;
    return `因为本次${markWord(it)}了「${t}」，经过「${mids.map((x) => byId.get(x).title).join(" → ")}」关联到「${me}」，需确认是否受影响`;
  }).join("；");
}
function whyBox(id) {
  const cs = causes(id);
  if (!cs.length) return "";
  const wired = new Set(D.impact.summary.wired), me = nameWithId(id);
  const lis = cs.map(({it, path}) => {
    const mids = path.slice(1, -1);
    if (path.length === 2 && it.mark === "+") {
      return `<li><div><b>原因</b>：图上画了「${me}」直接调用本次新增的${titleLink(it.id)}${edgeNote(id, it.id)}，但「${me}」本身还没标为修改（<code>~</code>）。</div><div class="chain"><b>需要确认</b>：调用新节点通常需要改动「${me}」的代码（或在地图里把「${me}」标上 <code>~</code>）。</div></li>`;
    }
    if (path.length === 2) {
      return `<li><div><b>原因</b>：「${me}」直接依赖了本次修改的${titleLink(it.id)}${edgeNote(id, it.id)}。</div><div class="chain"><b>需要确认</b>：确认${titleLink(it.id)}的改动是否影响「${me}」；如果对外接口和行为未变，则无需改动「${me}」。</div></li>`;
    }
    if (mids.length === 1 && inSub(path[2], path[1])) {
      return `<li><div><b>原因</b>：${titleLink(path[1])}区域内的子节点${titleLink(it.id)}本次有修改。</div><div class="chain"><b>图上连线</b>：「${me}」连到了整个${titleLink(path[1])}区域${edgeNote(id, path[1])}，没有细化到该区域内部具体用到了哪个子节点。<br><b>需要确认</b>：确认这次修改${titleLink(it.id)}后是否需要同步改动「${me}」；如果不需要，则无需改动「${me}」。</div></li>`;
    }
    const stepLinks = path.map((x, i) => (i === 0 ? `<b>「${nameWithId(x)}」</b>` : titleLink(x)) + (i > 0 && inSub(x, path[i - 1]) ? "）" : "") + (i + 1 < path.length ? (inSub(path[i + 1], x) ? "（包含子项" : " → ") : "")).join("");
    return `<li><div><b>原因</b>：本次${markWord(it)}了${titleLink(it.id)}，而「${me}」沿着 ${stepLinks} 间接关联到它。</div><div class="chain"><b>需要确认</b>：确认上游改动是否会沿着这条调用链传到「${me}」；如果已被中间节点隔离，则无需改动「${me}」。</div></li>`;
  }).join("");
  return `<h3>${wired.has(id) ? "为什么标为「也要一起改」" : "为什么标为「需检查」"}</h3><ul class="why">${lis}</ul>`;
}
const link = (id) => {
  const n = byId.get(id);
  const away = par(id) === state.scope ? "" : ` <span class="lab" title="点击会切换到这个节点所在的层">↗ ${par(id) ? esc(byId.get(par(id)).title) : "顶层"}</span>`;
  return `<a tabindex="0" data-go="${esc(id)}">${esc(n.title)}</a>${flat(n.title) === flat(id) ? "" : ` <span class="id">${esc(id)}</span>`}${away}`;

const LEVEL = {extension: "只是扩展", contained: "影响局部", wide: "影响通用边界"};
function verdictText(im) {
  const s = im.summary, parts = [];
  if (s.changedCore.length) parts.push(`修改通用节点：${names(s.changedCore)}`);
  if (s.newCore.length) parts.push(`新增通用节点：${names(s.newCore)}（新的共用边界）`);

  if (s.changedExt.length) parts.push(`修改外部系统：${names(s.changedExt)}`);
  const noEdit = !parts.length && !s.wired.length && !s.inspect.length;
  if (s.newOther.length) parts.push(`新增节点：${names(s.newOther)}${noEdit && !s.reused.length ? "（不改动任何已有节点）" : ""}`);
  if (s.reused.length) parts.push(`复用通用节点：${names(s.reused)}（只复用，不改动）${noEdit ? "，不改动任何已有节点" : ""}`);
  if (s.wired.length) parts.push(`也要一起改：${names(s.wired)}（直接调用了新增节点）`);
  if (s.inspect.length) parts.push(`需检查关联节点：${names(s.inspect)}（看是否受本次修改影响）`);
  return parts.join("；");
}

function noteText(n) {
  if (n.code === "cross-area-biz") { const a = n.area ? byId.get(n.area).title : "顶层"; return `注意:依赖了其他区域「${esc(a)}」里的业务节点 ${link(n.node)}`; }
  return "注意:没有声明任何依赖,看不出它复用了哪些通用节点";
}

// The nodes a planned node reaches, drawn as a tree: each node sits under the node it depends on.
function pathTree(it) {
  const kids = new Map();
  for (const chain of Object.values(it.paths || {})) {
    for (let i = 0; i + 1 < chain.length; i++) {
      const up = chain[i + 1];
      if (!kids.has(up)) kids.set(up, new Set());
      kids.get(up).add(chain[i]);
    }
  }
  if (!kids.size) return "";
  const draw = (id, depth) => [...(kids.get(id) || [])].sort().map((c) => {
    const n = byId.get(c), isBox = inSub(id, c);
    const tag = isBox ? '<span class="lab">通过上级区域 · </span>' : n.mark ? `<span class="tag ${n.mark === "+" ? "new" : "chg"}">${n.mark === "+" ? "新" : "改"}</span> ` : "";
    const hint = isBox ? ' <span class="lab">关联到：</span>' : n.mark ? "" : depth === 0 ? ` <span class="lab">${it.mark === "+" ? "直接调用 · 要一起改" : "直接依赖 · 需检查"}</span>` : ' <span class="lab">需检查</span>';
    return `<div class="lv"><div class="row">${tag}<a tabindex="0" data-go="${esc(c)}">${esc(n.title)}</a>${hint}</div>${draw(c, depth + 1)}</div>`;
  }).join("");
  return `<div class="ptree"><div class="row root">${esc(byId.get(it.id).title)} <span class="lab">${it.mark === "+" ? "新增" : "修改"}</span></div>${draw(it.id, 0)}</div>`;
}

function impactBox(only) {
  const im = D.impact;
  if (!im.items.length) return "";
  const rows = (only ? [only] : im.items).map((it) => {
    const parts = [];
    const unchangedCore = it.reusesCore.filter((c) => !byId.get(c).mark);
    const plannedCore = it.reusesCore.filter((c) => byId.get(c).mark);
    if (unchangedCore.length) parts.push(`复用通用节点（不改动）:${unchangedCore.map(link).join("、")}`);
    if (plannedCore.length) parts.push(`依赖本次改动的通用节点:${plannedCore.map(link).join("、")}`);
    if (it.dependsBiz.length) parts.push(`依赖业务节点:${it.dependsBiz.map(link).join("、")}`);
    if (it.dependsExt.length) parts.push(`依赖外部系统:${it.dependsExt.map(link).join("、")}`);
    if (it.dependents.length) {
      const wCount = wiredCount(it), iCount = it.dependents.length - wCount;
      const desc = [wCount ? `直接调用新节点、要一起改的已有节点 ${wCount} 个` : "", iCount ? `需检查的关联节点 ${iCount} 个` : ""].filter(Boolean).join("，");
      parts.push(`${desc},依赖路径:${pathTree(it)}<button class="btn" data-impact="${esc(it.id)}">在画布上看影响路径</button>`);
    }
    if (it.flows.length) parts.push(`涉及流程:${it.flows.map((f) => esc((D.flows.find((x) => x.id === f) || {title: f}).title)).join("、")}`);
    parts.push(...it.notes.map(noteText));
    return `<li><span class="tag ${it.mark === "+" ? "new" : "chg"}">${it.mark === "+" ? "新增" : "修改"}</span> ${link(it.id)}<div class="lab">${parts.join("<br>")}</div></li>`;
  }).join("");
  return `<h3>计划改动的影响</h3><div class="verdict ${im.level}"><b>${LEVEL[im.level] || ""}</b>${verdictText(im)}</div><ul>${rows}</ul>`;
}

// Moving to another level or flow is a step in the browser history, so Back and Forward work
// (and so do the buttons next to the title). Selecting a node only replaces the current step.
let shownScope = "", shownKey = "", shownFlow = "", navIndex = 0, navMax = 0, fromHistory = false;

let firstRender = true, pendingRender = 0, pendingFromHistory = false, enterAnim = null;

const within = (a, b) => (b === "" ? a !== "" : a !== b && inSub(a, b));
function renderAll() {
  if (pendingRender) { pendingFromHistory = pendingFromHistory || fromHistory; return; } // a render already waits for the fade-out; it reads the latest state
  if ((state.scope !== shownScope || viewKey() !== shownKey) && !firstRender && !calm.matches) {
    document.querySelectorAll(".node").forEach((n) => n.classList.add("leaving"));
    $("edges").classList.add("leaving"); $("pills").classList.add("leaving"); $("areas").classList.add("leaving");
    pendingFromHistory = fromHistory; // the popstate handler clears its flag before this timer fires
    pendingRender = setTimeout(() => { pendingRender = 0; fromHistory = pendingFromHistory; renderNow(); fromHistory = false; }, 130);
    return;
  }

}
function renderNow() {
  const moved = state.scope !== shownScope || state.flow !== shownFlow || viewKey() !== shownKey;
  if (state.scope !== shownScope || viewKey() !== shownKey) {
    if (!firstRender && !calm.matches) enterAnim = {from: viewKey() !== shownKey ? 1 : within(state.scope, shownScope) ? 0.93 : within(shownScope, state.scope) ? 1.05 : 1};
    shownScope = state.scope; shownKey = viewKey(); viewMode = state.diagram ? "fit" : special() ? "overview" : "auto"; // a zoom chosen for one level does not follow you into another
  }
  firstRender = false;
  shownFlow = state.flow;
  // Everything is redrawn, so remember which row or node had the keyboard focus.
  const held = document.activeElement.closest && document.activeElement.closest(".node, .orow, .frow");
  const keep = held && {cls: [...held.classList].find((c) => ["node", "orow", "frow"].includes(c)), attr: held.dataset.id ? "id" : "flow", val: held.dataset.id || held.dataset.flow};
  renderChrome(); renderPageHead(); renderMap(); renderSide(); renderDetail(); syncHash(moved && !fromHistory);
  $("back").disabled = navIndex <= 0; $("fwd").disabled = navIndex >= navMax;
  if (keep && document.activeElement === document.body) {
    const el = document.querySelector(`.${keep.cls}[data-${keep.attr}="${CSS.escape(keep.val)}"]`);
    if (el && el.offsetParent) el.focus();
  }
}

function syncHash(push) {
  const p = new URLSearchParams();
  if (state.scope) p.set("s", state.scope);
  if (state.sel) p.set("n", state.sel);
  if (state.flow) p.set("f", state.flow);
  if (state.impact) p.set("i", state.impact);
  if (state.hood) { p.set("h", state.hood); if (state.hops !== 2) p.set("k", state.hops); }
  const h = p.toString() ? "#" + p.toString() : "";
  // Sandboxed frames (an embedded view) may refuse to change the URL; the page still works without it.
  try {
    if (location.hash !== h) {
      const url = location.pathname + location.search + h;
      if (push) { navIndex++; navMax = navIndex; history.pushState({i: navIndex}, "", url); } else history.replaceState({i: navIndex}, "", url);
    }
  } catch (e) { /* no shareable link or history in this frame */ }
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (state.diagram) leaveDiagram();
  state = {scope: p.get("s") || "", sel: p.get("n") || "", flow: p.get("f") || "", impact: p.get("i") || "", hood: p.get("h") || "", hops: Math.min(3, Math.max(1, parseInt(p.get("k"), 10) || 2)), diagram: "", diagramIndex: 0};
  setData(D);
}

function closeMenu() {
  document.body.classList.remove("menu-open");
  $("menu").setAttribute("aria-expanded", "false");
  if (matchMedia("(max-width:1100px)").matches && !$("searchBox").hidden) {
    $("searchBox").hidden = true;
    $("searchStatus").hidden = true;
    $("searchToggle").setAttribute("aria-expanded", "false");
    $("searchToggle").setAttribute("aria-label", "搜索节点");
    $("searchToggle").title = "搜索节点 (/)";
  }
}
function reveal(id) {
  closeMenu();
  leaveDiagram();
  if (special() && buildView().ids.includes(id)) { state.sel = id; return; } // already on the canvas: just select it
  state.impact = ""; state.hood = "";
  state.scope = par(id); state.sel = id; viewMode = "auto"; anc(id).forEach((a) => open.add(a));
} // jumping to a node shows the whole level, so the node is never off screen
function enter(id) { leaveDiagram(); state.impact = ""; state.hood = ""; state.scope = id; state.sel = ""; open.add(id); anc(id).forEach((a) => open.add(a)); }
function lca(ids) {
  const paths = ids.map((i) => anc(i).reverse());
  let out = "";
  for (let k = 0; paths.every((p) => p[k] && p[k] === paths[0][k]); k++) out = paths[0][k];
  return out;
}
function pickFlow(id) {
  closeMenu();
  leaveDiagram();
  state.flow = state.flow === id ? "" : id; state.sel = ""; state.impact = ""; state.hood = "";
  const f = D.flows.find((x) => x.id === state.flow);
  if (f && f.steps.length) {
    state.scope = lca(f.steps.flatMap((s) => [s.from, s.to]));
  }
  renderAll();
}

function setSearchOpen(on) {

    $("search").focus();

    $("search").value = ""; query = ""; renderSide(); $("searchToggle").focus();
  }
}

document.addEventListener("click", (ev) => {
  if (suppressClick) { suppressClick = false; return; }
  const t = ev.target;
  const caret = t.closest("[data-caret]");
  if (caret) { const id = caret.dataset.caret; open.has(id) ? open.delete(id) : open.add(id); renderSide(); return; }
  const row = t.closest(".orow");
  if (row) { reveal(row.dataset.id); renderAll(); return; }
  if (t.closest("#back")) { try { history.back(); } catch (e) {} return; }
  if (t.closest("#fwd")) { try { history.forward(); } catch (e) {} return; }
  const im = t.closest("[data-impact]");
  if (im) { closeMenu(); leaveDiagram(); state.impact = im.dataset.impact; state.hood = ""; state.flow = ""; state.sel = im.dataset.impact === "*" ? "" : im.dataset.impact; renderAll(); return; }
  const hd = t.closest("[data-hood]");
  if (hd) { leaveDiagram(); state.hood = hd.dataset.hood; state.impact = ""; state.flow = ""; state.sel = state.hood; renderAll(); return; }
  const hp = t.closest("[data-hops]");
  if (hp) { state.hops = Number(hp.dataset.hops); renderAll(); return; }
  if (t.closest("#impactOff")) { leaveDiagram(); state.impact = ""; state.hood = ""; renderAll(); return; }
  const dg = t.closest("[data-diagram]");
  if (dg) {
    state.diagram = dg.dataset.diagram; state.diagramIndex = Number(dg.dataset.index) || 0;
    state.flow = ""; state.impact = ""; state.hood = ""; state.sel = dg.dataset.diagram;
    viewMode = "fit"; lastLayoutKey = ""; renderAll(); return;
  }
  if (t.closest("#toggleSidebars")) {
    const expanded = $("app").classList.toggle("diagram-expanded");
    $("toggleSidebars").setAttribute("aria-expanded", String(!expanded));
    $("toggleSidebars").textContent = expanded ? "显示侧栏" : "隐藏侧栏";
    if (viewMode !== "free") applyView();
    return;
  }
  if (t.closest("#backToMap")) { leaveDiagram(); renderAll(); return; }
  const node = t.closest(".node");
  if (node && t.closest("[data-kids]")) { enter(node.dataset.id); renderAll(); return; }
  if (node) {
    // Selecting redraws the nodes, so the browser would lose the second click of a double click.
    // Detect it here: the same node clicked again within 400ms goes inside it.
    const id = node.dataset.id, now = Date.now();

    else { lastClick = {id, at: now}; state.sel = id; }
    renderAll(); return;

  if (t.closest("#searchToggle")) { setSearchOpen($("searchBox").hidden); return; }
  if (t.closest("#searchClear")) { $("search").value = ""; query = ""; renderSide(); $("search").focus(); return; }
  if (t.closest("#menu")) { const on = document.body.classList.toggle("menu-open"); $("menu").setAttribute("aria-expanded", String(on)); return; }
  if (t.closest("#outer")) { showOuter = !showOuter; $("outer").setAttribute("aria-pressed", String(showOuter)); renderMap(); return; }

  if (zb) { const k = zb.dataset.zoom; if (k === "-") zoomBy(0.8); else if (k === "+") zoomBy(1.25); else { viewMode = k; applyView(); } return; }
  const go = t.closest("[data-go]");
  if (go) { reveal(go.dataset.go); renderAll(); return; }
  const sc = t.closest("[data-scope]");
  if (sc) { leaveDiagram(); state.scope = sc.dataset.scope; state.sel = ""; state.impact = ""; state.hood = ""; renderAll(); return; }
  const en = t.closest("[data-enter]");
  if (en) { enter(en.dataset.enter); renderAll(); return; }
  const fl = t.closest("[data-flow]");
  if (fl) { pickFlow(fl.dataset.flow); return; }
  if (t.closest("#clearFlow")) { leaveDiagram(); state.flow = ""; renderAll(); return; }
  if (t.closest("#warn")) { $("banner").classList.toggle("on"); return; }
  if (t.closest("#theme")) {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("sysmap-theme", next); } catch (e) {}
    // A Pele SVG bakes theme colours in at render time, so redraw both the card and the canvas.

});
document.addEventListener("keydown", (ev) => {
  const typing = document.activeElement.tagName === "INPUT";
  if (ev.altKey && (ev.key === "ArrowLeft" || ev.key === "ArrowRight")) { ev.preventDefault(); try { ev.key === "ArrowLeft" ? history.back() : history.forward(); } catch (e) {} return; }
  if (!typing && (ev.key === "+" || ev.key === "=")) { zoomBy(1.25); return; }
  if (!typing && (ev.key === "-" || ev.key === "_")) { zoomBy(0.8); return; }
  if (!typing && ev.key === "0") { viewMode = "auto"; applyView(); return; }
  if (ev.key === "/" && !typing) { ev.preventDefault(); setSearchOpen(true); return; }
  if (ev.key === "Escape") {
    if ($("searchBox").contains(document.activeElement)) { setSearchOpen(false); }
    else if (state.diagram) { leaveDiagram(); renderAll(); }
    else if (special()) { state.impact = ""; state.hood = ""; renderAll(); }
    else if (state.flow) { state.flow = ""; renderAll(); }
    else if (state.scope) { state.scope = par(state.scope); state.sel = ""; renderAll(); }
    return;
  }
  const active = document.activeElement;
  if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
    const row = active.closest && active.closest(".orow");
    if (row && byId.get(row.dataset.id).children.length) {
      ev.preventDefault();
      ev.key === "ArrowRight" ? open.add(row.dataset.id) : open.delete(row.dataset.id);
      renderSide();
      const again = document.querySelector(`.orow[data-id="${CSS.escape(row.dataset.id)}"]`);
      if (again) again.focus();
    }
    return;
  }
  if ((ev.key === "Enter" || ev.key === " ") && active.matches && active.matches("[data-go],[data-scope],[data-flow],[data-enter]") && !active.matches(".frow")) {
    ev.preventDefault(); active.click(); return;
  }
  if (ev.key === " " && active.classList && active.classList.contains("node")) { ev.preventDefault(); }
  if (ev.key === "Enter" || (ev.key === " " && active.classList && active.classList.contains("node"))) {
    if (document.activeElement === $("search")) {
      const q = query.trim().toLowerCase();
      const hit = D.nodes.find((n) => (n.id + " " + n.title + " " + n.desc).toLowerCase().includes(q));
      if (q && hit) { reveal(hit.id); renderAll(); }
      return;
    }
    const el = document.activeElement.closest && document.activeElement.closest("[data-id],[data-flow]");
    if (!el) return;
    if (el.dataset.flow) { pickFlow(el.dataset.flow); return; }
    const id = el.dataset.id;
    const isMapNode = el.classList.contains("node");
    if (isMapNode && state.sel === id && byId.get(id).children.length) enter(id); else if (isMapNode) state.sel = id; else reveal(id);
    renderAll();
    const next = document.querySelector(`${isMapNode ? ".node" : ".orow"}[data-id="${CSS.escape(id)}"]`);
    if (next) next.focus();
  }
});
$("search").addEventListener("input", (ev) => { query = ev.target.value; renderSide(); });
let wasNarrow = isNarrow();
window.addEventListener("resize", () => {
  if (isNarrow() !== wasNarrow) { wasNarrow = isNarrow(); renderMap(); }
  if (viewMode !== "free") applyView();
});
window.addEventListener("popstate", (ev) => {
  navIndex = (ev.state && ev.state.i) || 0; // our own position, to enable or disable the buttons
  readHash(); fromHistory = true; renderAll(); fromHistory = false;
});

setData(JSON.parse($("data").textContent));
try { navIndex = navMax = (history.state && history.state.i) || 0; } catch (e) {}
setupPanzoom();
roots().forEach((r) => open.add(r));
if (location.hash.length > 1) readHash();
if (state.sel) anc(state.sel).forEach((a) => open.add(a));
renderAll();

if (document.body.dataset.live) {
  setInterval(async () => {
    try {
      const d = await (await fetch("/data.json", {cache: "no-store"})).json();
      // A map that gains its first diagram needs the renderer, which is only in the page that was served with one.
      if (d.nodes.some((n) => (n.diagrams || []).length) && typeof pele === "undefined") { location.reload(); return; }
      if (connectionLost || d.version !== D.version || d.programVersion !== D.programVersion || JSON.stringify(d.diags) !== JSON.stringify(D.diags) || JSON.stringify(d.fileVersions) !== JSON.stringify(D.fileVersions)) { connectionLost = false; setData(d); renderAll(); }
    } catch (e) { if (!connectionLost) { connectionLost = true; renderChrome(); renderDetail(); } }
  }, 1500);
}
</script>
